name: IssaReader

options:
  bundleIdPrefix: com.benjaminissa.issareader
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: D8455BV6NN
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "26"

packages:
  IssaReaderKit:
    path: .

targets:
  IssaReader-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/IssaReader-iOS/Sources
      - path: Apps/Shared/Sources
      - path: Apps/IssaReader-iOS/Assets.xcassets
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
      - package: IssaReaderKit
        product: IssaEPUB
      - package: IssaReaderKit
        product: IssaRender
      - package: IssaReaderKit
        product: IssaPlayback
      - target: IssaWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader
        INFOPLIST_FILE: Apps/IssaReader-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Apps/IssaReader-iOS/IssaReader.entitlements
      configs:
        Debug:
          # ISSA_UITEST_FIXTURE is defined here and nowhere else, over exactly
          # the configurations DEBUG covers — so on its own it is not a second
          # lock, it is `#if DEBUG` under another name, and it was described as
          # an independent gate for two builds while being no such thing.
          #
          # The real gate is EXCLUDED_SOURCE_FILE_NAMES on Release below: the
          # compiler is never handed the fixture files at all, so no textual
          # condition can leak them. This flag stays because it keeps the
          # fixture out of a *Debug* build that is not the sweep, and because
          # `#if` is what makes the intent legible at each site.
          #
          # `$(inherited)` matters: without it this replaces the project-level
          # list rather than extending it.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ISSA_UITEST_FIXTURE"
        Release:
          # The layout-sweep fixture ships a stub server and an in-memory token
          # store. Excluding the sources is what makes "it cannot reach a
          # release" a fact about the build rather than a claim about a macro;
          # scripts/release.sh then greps the archived binary as a backstop, and
          # proves that grep can fire before trusting it.
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) Apps/IssaReader-iOS/Sources/UITestSupport/*"

  # Unit tests over Apps/Shared, which no other target can reach.
  #
  # AppModel and ReaderModel hold forty-plus of the review's findings and had no
  # test coverage of any kind: `Apps/Shared/Sources` is a source *path* compiled
  # into each app target, not a package, so `swift test` cannot see it and
  # IssaLayoutUITests is black-box XCUITest that can only drive the accessibility
  # tree. Hosting a unit bundle on the iOS app puts those types in reach of
  # `@testable import`, which is what makes the position and sign-out fixes
  # testable rather than simulator-only.
  IssaSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/IssaSharedTests/Sources
      # The EPUB the IssaEPUB and IssaRender suites already use. The contents
      # list lives in Apps/Shared, so the only way to test it against a real
      # book's navigation is to bundle one here; a hand-built package would
      # test the assertion rather than the book.
      - path: Packages/IssaEPUB/Tests/Fixtures/alice.epub
        buildPhase: resources
    dependencies:
      - target: IssaReader-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader.sharedtests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IssaReader-iOS.app/IssaReader-iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Not `IssaUITests`: that name is already a SwiftPM *unit* test target for
  # the IssaUI package, and two targets with one name in a project that
  # consumes that package is a collision waiting to happen.
  IssaLayoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/IssaLayoutUITests/Sources
    dependencies:
      - target: IssaReader-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader.layoutuitests
        # XcodeGen writes the target dependency but not this, and without it
        # xcodebuild has no host app to launch.
        TEST_TARGET_NAME: IssaReader-iOS
        GENERATE_INFOPLIST_FILE: YES
        # Matching the host: a bundle restricted to iPhone will not install on
        # an iPad destination, and the sweep runs on both.
        TARGETED_DEVICE_FAMILY: "1,2"

  IssaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/IssaWidgets/Sources
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader.widgets
        INFOPLIST_FILE: Apps/IssaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/IssaWidgets/IssaWidgets.entitlements

  IssaReader-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/IssaReader-macOS/Sources
      - path: Apps/Shared/Sources
      - path: Apps/IssaReader-macOS/Assets.xcassets
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
      - package: IssaReaderKit
        product: IssaEPUB
      - package: IssaReaderKit
        product: IssaRender
      - package: IssaReaderKit
        product: IssaPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader
        INFOPLIST_FILE: Apps/IssaReader-macOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Signed with the Apple Development certificate, not ad-hoc, and with
        # no provisioning profile — which works because the Debug entitlements
        # deliberately ask for nothing that needs one. Ad-hoc cost two real
        # things: the sandbox could not be turned on (an ad-hoc bundle has a
        # hash identifier, and the sandbox cannot make a container from that),
        # so the configuration that ships was never the one that ran; and every
        # rebuild produced a different code identity, so the keychain refused
        # the saved token and prompted for the login password on each launch.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/IssaReader-macOS/IssaReader-Debug.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
          DEVELOPMENT_TEAM: D8455BV6NN
        # Real Mac App Store signing, pinned the same way tvOS is and for the
        # same reason: Automatic archiving mints a Development profile first,
        # which enumerates device UDIDs, and this team has none registered for
        # the platform. The profile was created through the App Store Connect
        # API against the UNIVERSAL App ID; `xcodebuild` cannot borrow Xcode's
        # signed-in account, so the API key is the only route.
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/IssaReader-macOS/IssaReader.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "macOS Store Provisioning Profile: com.benjaminissa.issareader"
          DEVELOPMENT_TEAM: D8455BV6NN
          ENABLE_HARDENED_RUNTIME: YES

  IssaReader-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Apps/IssaReader-tvOS/Sources
      - path: Apps/Shared/Sources
      - path: Apps/IssaReader-tvOS/Assets.xcassets
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
      - package: IssaReaderKit
        product: IssaEPUB
      - package: IssaReaderKit
        product: IssaRender
      - package: IssaReaderKit
        product: IssaPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader
        INFOPLIST_FILE: Apps/IssaReader-tvOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      configs:
        Release:
          # Automatic signing tries to mint a Development profile for an
          # archive, and this team has no registered tvOS devices to mint one
          # against — App Store distribution profiles need no device at all,
          # so Release pins straight to the one already created for this app.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "tvOS Store Provisioning Profile: com.benjaminissa.issareader"

schemes:
  # Shared, and explicit about its test action.
  #
  # Without this the scheme is implicit and its Test action is composed by
  # heuristic. The failure mode is the worst one available: the build succeeds,
  # zero tests run, and the sweep exits 0 reporting a clean pass. The script
  # guards against that too, by refusing a result bundle with no tests in it.
  IssaReader-iOS:
    build:
      targets:
        IssaReader-iOS: all
        IssaLayoutUITests: [test]
        IssaSharedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Serial. Two runners on one simulator interleave their screenshots into
      # one result bundle and race the fixture's URLProtocol registration.
      parallelizable: false
      targets:
        # Both, and listed explicitly. A target missing from here runs zero
        # tests while the build still succeeds — the failure this block exists
        # to prevent.
        - IssaSharedTests
        - IssaLayoutUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
