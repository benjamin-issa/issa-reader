name: IssaReader

options:
  bundleIdPrefix: com.benjaminissa.issareader
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: D8455BV6NN
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "20"

packages:
  IssaReaderKit:
    path: .

targets:
  IssaReader-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/IssaReader-iOS/Sources
      - path: Apps/Shared/Sources
      - path: Apps/IssaReader-iOS/Assets.xcassets
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
      - package: IssaReaderKit
        product: IssaEPUB
      - package: IssaReaderKit
        product: IssaRender
      - package: IssaReaderKit
        product: IssaPlayback
      - target: IssaWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader
        INFOPLIST_FILE: Apps/IssaReader-iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Apps/IssaReader-iOS/IssaReader.entitlements

  IssaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/IssaWidgets/Sources
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader.widgets
        INFOPLIST_FILE: Apps/IssaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/IssaWidgets/IssaWidgets.entitlements

  IssaReader-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/IssaReader-macOS/Sources
      - path: Apps/Shared/Sources
      - path: Apps/IssaReader-macOS/Assets.xcassets
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
      - package: IssaReaderKit
        product: IssaEPUB
      - package: IssaReaderKit
        product: IssaRender
      - package: IssaReaderKit
        product: IssaPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader
        INFOPLIST_FILE: Apps/IssaReader-macOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Signed with the Apple Development certificate, not ad-hoc, and with
        # no provisioning profile — which works because the Debug entitlements
        # deliberately ask for nothing that needs one. Ad-hoc cost two real
        # things: the sandbox could not be turned on (an ad-hoc bundle has a
        # hash identifier, and the sandbox cannot make a container from that),
        # so the configuration that ships was never the one that ran; and every
        # rebuild produced a different code identity, so the keychain refused
        # the saved token and prompted for the login password on each launch.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/IssaReader-macOS/IssaReader-Debug.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
          DEVELOPMENT_TEAM: D8455BV6NN
        # Real Mac App Store signing, pinned the same way tvOS is and for the
        # same reason: Automatic archiving mints a Development profile first,
        # which enumerates device UDIDs, and this team has none registered for
        # the platform. The profile was created through the App Store Connect
        # API against the UNIVERSAL App ID; `xcodebuild` cannot borrow Xcode's
        # signed-in account, so the API key is the only route.
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/IssaReader-macOS/IssaReader.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "macOS Store Provisioning Profile: com.benjaminissa.issareader"
          DEVELOPMENT_TEAM: D8455BV6NN
          ENABLE_HARDENED_RUNTIME: YES

  IssaReader-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Apps/IssaReader-tvOS/Sources
      - path: Apps/Shared/Sources
      - path: Apps/IssaReader-tvOS/Assets.xcassets
    dependencies:
      - package: IssaReaderKit
        product: IssaCore
      - package: IssaReaderKit
        product: IssaUI
      - package: IssaReaderKit
        product: IssaEPUB
      - package: IssaReaderKit
        product: IssaRender
      - package: IssaReaderKit
        product: IssaPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminissa.issareader
        INFOPLIST_FILE: Apps/IssaReader-tvOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      configs:
        Release:
          # Automatic signing tries to mint a Development profile for an
          # archive, and this team has no registered tvOS devices to mint one
          # against — App Store distribution profiles need no device at all,
          # so Release pins straight to the one already created for this app.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "tvOS Store Provisioning Profile: com.benjaminissa.issareader"
